name: Verify Android library and Demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Android
        uses: actions/checkout@v7
        with:
          path: android-smooth-markdown
      - name: Check out Flutter fixture source
        uses: actions/checkout@v7
        with:
          repository: JackCaow/flutter-smooth-markdown
          ref: 0634734ccc6e2c63ab78904a68496f4b0a29f071
          path: flutter-smooth-markdown
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 37
        run: sdkmanager 'platforms;android-37.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check Flutter Demo fixtures
        working-directory: android-smooth-markdown
        run: python3 tools/check_flutter_example_parity.py
      - name: Test library and Demo; compile UI tests; assemble Demo
        working-directory: android-smooth-markdown
        run: ./gradlew :consumer-smoke:verifyConsumer :consumer-reader:assembleDebug :smoothmarkdown:testDebugUnitTest :smoothmarkdown:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Check public JVM signatures
        working-directory: android-smooth-markdown
        run: python3 tools/check_public_api.py

  public-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Install build SDK and emulator
        run: sdkmanager 'platforms;android-37.0' 'system-images;android-35;google_apis;x86_64' 'emulator'
      - name: Boot emulator
        run: |
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd --force --name public-ui --package 'system-images;android-35;google_apis;x86_64'
          emulator -avd public-ui -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
      - name: Verify public API runtime behavior
        run: ./gradlew :smoothmarkdown:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.jackcaow.smoothmarkdown.PublicLibraryUiSuite --no-daemon
