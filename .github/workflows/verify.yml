name: Verify Android library and Demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Android
        uses: actions/checkout@v7
        with:
          path: android-smooth-markdown
      - name: Check out Flutter fixture source
        uses: actions/checkout@v7
        with:
          repository: JackCaow/flutter-smooth-markdown
          ref: 0634734ccc6e2c63ab78904a68496f4b0a29f071
          path: flutter-smooth-markdown
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 35
        run: |
          sdkmanager 'platforms;android-35' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Set up owned Rust parser toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Verify owned Rust source and grammar fixtures
        working-directory: android-smooth-markdown/rust-core
        run: |
          shasum -a 256 -c SOURCE.sha256
          cargo test --locked --offline
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check Flutter Demo fixtures
        working-directory: android-smooth-markdown
        run: python3 tools/check_flutter_example_parity.py
      - name: Test library and Demo; compile UI tests; assemble Demo
        working-directory: android-smooth-markdown
        run: ./gradlew :smoothmarkdown-core:test :consumer-smoke:verifyConsumer :consumer-reader:assembleDebug :smoothmarkdown:testDebugUnitTest :smoothmarkdown:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify staged Maven consumers
        working-directory: android-smooth-markdown
        run: |
          ./gradlew :smoothmarkdown-core:publishReleasePublicationToCentralBundleRepository :smoothmarkdown:publishReleasePublicationToCentralBundleRepository --no-daemon
          ./gradlew :consumer-smoke:verifyConsumer :consumer-reader:assembleDebug -PconsumerArtifactVersion=0.4.0 --no-daemon
      - name: Verify independently compiled old and modern consumers
        working-directory: android-smooth-markdown
        run: |
          ./gradlew -p compatibility-consumer assembleDebug -PartifactRepository="$PWD/build/central-staging" -PartifactVersion=0.4.0 --no-daemon
          ./gradlew -p compatibility-consumer clean assembleDebug -PmodernKotlin=true -PartifactRepository="$PWD/build/central-staging" -PartifactVersion=0.4.0 --no-daemon
      - name: Check consumer requirements in AAR and POM
        working-directory: android-smooth-markdown
        run: python3 tools/check_consumer_requirements.py
      - name: Verify four packaged native ABIs and 16KB ELF alignment
        working-directory: android-smooth-markdown
        run: python3 scripts/build-rust-parser.py --check-aar smoothmarkdown/build/outputs/aar/smoothmarkdown-release.aar
      - name: Check public JVM signatures
        working-directory: android-smooth-markdown
        run: python3 tools/check_public_api.py

  public-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Install build SDK and emulator
        run: |
          sdkmanager 'platforms;android-35' 'ndk;28.2.13676358' 'system-images;android-35;google_apis;x86_64' 'emulator'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Set up owned Rust parser toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Boot emulator
        timeout-minutes: 7
        run: |
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd --force --name public-ui --package 'system-images;android-35;google_apis;x86_64'
          trap 'cat "$RUNNER_TEMP/emulator.log"' EXIT
          "$ANDROID_HOME/emulator/emulator" -avd public-ui -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 300 adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
      - name: Verify public API runtime behavior
        run: ./gradlew :smoothmarkdown:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.jackcaow.smoothmarkdown.PublicLibraryUiSuite,com.jackcaow.smoothmarkdown.SelectionCompatibilityUiSuite --no-daemon
      - name: Verify Demo paragraph selection
        run: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.jackcaow.smoothmarkdown.demo.ConversationLongPressUiTest --no-daemon
