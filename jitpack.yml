jdk:
  - openjdk17
before_install:
  - sdkmanager 'platforms;android-37.0' 'ndk;28.2.13676358'
  - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
  - $HOME/.cargo/bin/rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
install:
  - PATH="$HOME/.cargo/bin:$PATH" ./gradlew :smoothmarkdown-core:publishReleasePublicationToMavenLocal :smoothmarkdown:publishReleasePublicationToMavenLocal --no-daemon
